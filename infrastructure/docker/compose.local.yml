version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nukkadnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: "identity_db,merchant_db,catalog_db,discovery_db,order_db,fulfillment_db,payment_db,subscription_db,analytics_db"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - nukkadnow-mesh

  redis:
    image: redis:7.2-alpine
    container_name: nukkadnow-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_local_pass
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - nukkadnow-mesh

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nukkadnow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nukkadnow
      RABBITMQ_DEFAULT_PASS: rabbitmq_local_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - nukkadnow-mesh

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: nukkadnow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - nukkadnow-mesh

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:

networks:
  nukkadnow-mesh:
    driver: bridge
